name: ruta_gen_app
description: Base Flutter de la app de fidelización Ruta Gen.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^10.3.1

  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/app_icon.png"

  min_sdk_android: 21

  remove_alpha_ios: true
  background_color_ios: "#082F49"